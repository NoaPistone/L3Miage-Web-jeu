<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Scores</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <header>
        <nav>
            <div class="logo">
                <img src="../assets/logo.png" alt="Logo">
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="about.html">À Propos</a></li>
                <li><a href="scores.html">Score</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="nav-icons">
                <i class="fas fa-user-circle" id="login-icon"></i>
            </div>
        </nav>
    </header>

    <div id="auth-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h2 id="modal-title">Connexion</h2>
            <input type="text" id="username" placeholder="Pseudo">
            <input type="password" id="password" placeholder="Mot de passe">
            <div id="auth-error" style="color: red; font-size: 0.8rem; margin-bottom: 10px;"></div>

            <button id="btn-action" class="btn-primary">Se connecter</button>
            <p id="toggle-auth">Pas de compte ? <span style="color:red; cursor:pointer;">Créer un compte</span></p>
            <button id="close-modal">Fermer</button>
        </div>
    </div>

    <main>
        <section class="scores-container-main">
            <h2 style="margin-bottom: 2rem; border-left: 4px solid var(--accent-red); padding-left: 15px;">
                🏆 Mes meilleurs scores
            </h2>

            <div id="scores-container" class="scores-grid">
                <p class="status-msg">Chargement des scores...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Noa Pistone & Biljana Djordjevic</p>
    </footer>

    <script>
        const NOMS = { jeu1: 'Jeu Canvas 2D', jeu2: 'Jeu Babylon.js' };

        async function loadScores() {
            const token = localStorage.getItem('token');
            const pseudo = localStorage.getItem('pseudo');
            const container = document.getElementById('scores-container');

            if (!token) {
                container.innerHTML = '<p class="status-msg">Connectez-vous pour voir vos scores.</p>';
                return;
            }

            try {
                const res = await fetch('/api/scores', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (res.status === 401) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('pseudo');
                    container.innerHTML = '<p class="status-msg">Session expirée. Connectez-vous.</p>';
                    return;
                }

                const data = await res.json();
                container.innerHTML = '';

                for (const [jeu, scores] of Object.entries(data)) {
                    const card = document.createElement('div');
                    card.className = 'score-card';

                    const listScores = scores.length > 0
                        ? scores.map((s, i) => `
                            <div class="score-row">
                                <span>#${i + 1}</span>
                                <span class="score-value">${s.score} pts</span>
                                <span class="score-date">${new Date(s.date).toLocaleDateString('fr-FR')}</span>
                            </div>`).join('')
                        : '<p>Aucun score enregistré.</p>';

                    card.innerHTML = `
                        <h3>${NOMS[jeu] || jeu}</h3>
                        ${listScores}
                        <div class="score-footer">👤 Joueur : ${pseudo}</div>
                    `;
                    container.appendChild(card);
                }
            } catch (err) {
                container.innerHTML = '<p class="status-msg">Erreur de connexion au serveur.</p>';
            }
        }

        loadScores();
    </script>
    <script src="script.js"></script>
</body>

</html>
