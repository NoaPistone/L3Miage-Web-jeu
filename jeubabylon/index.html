<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <title>Test BabylonJS</title>
  <link rel="stylesheet" href="/src/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
</head>

<body>
  <canvas id="renderCanvas"></canvas>

<div id="mainMenu" class="menuOverlay">
  <div class="menuPanel">
    <h1 class="menuTitle">Le Labyrinthe</h1>

    <div class="menuButtons">
      <button id="storyBtn" class="menuButton">Mode histoire</button>
      <button id="levelBtn" class="menuButton">Choix du niveau</button>
      <button id="quitBtn" class="menuButton">Quitter</button>
    </div>
  </div>
</div>

<div id="levelMenu" class="menuOverlay hidden">
  <div class="menuPanel">
    <h1 class="menuTitle">Choisir un niveau</h1>

    <div id="levelButtons"></div>

    <button id="backBtn" class="menuButton">Retour</button>
  </div>
</div>

  <div id="hudDroit">
    <div id="score">Score : <span id="scoreValue">0</span></div>
  </div>

  <div id="hudMilieu">
    <img src="/src/assets/icons/temps.png" id="iconTemps" />
    <div id="chrono"><span id="chronoValue">00:00</span></div>
</div>

  <div id="hudGauche">
    <div id="vie">
        <img src="/src/assets/icons/vie.png" id="iconeVie" />
        <div id="vieBar">
            <div id="vieBarFill"></div>
        </div>
    </div>
</div>
<div id="gameOver">
    <div id="gameOverContent">
        <h1 id="gameOverTitle"> PARTIE TERMINÉE </h1>
        <p id="gameOverText">Vous n'avez plus de vie...</p>
        <p id="gameOverScore">Score final : <span id="gameOverScoreValue">0</span></p>
        <button id="gameOverBtn">Recommencer</button>
    </div>
</div>
<div id="transition"></div>
<div id="introScreen" class="menuOverlay hidden">
  <div class="menuPanel" style="max-width:620px">
    <h1 class="menuTitle">Le Labyrinthe</h1>
    <div id="introText" class="introText"></div>
    <button id="introBtn" class="menuButton">Commencer</button>
  </div>
</div>

<div id="levelIntro" class="menuOverlay hidden">
  <div class="menuPanel" style="max-width:520px">
    <p id="levelIntroText" class="introText"></p>
    <button id="levelIntroBtn" class="menuButton">Entrer</button>
  </div>
</div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
