<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puissance 4</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/logo.png">
    <link rel="apple-touch-icon" href="assets/logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <div class="logo-container">
            <img src="assets/logo.png" alt="Logo Puissance 4" class="main-logo">
            <h1>PUISSANCE <span class="p1-text">4</span></h1>
        </div>
        <p>Physique Réelle & Rendu SVG</p>
    </div>

    <div class="scoreboard">
        <div id="p1-score-card" class="player-score active">
            <span class="p1-text">Rouge</span>
            <span id="p1-wins" class="score-val">0</span>
            <small id="p1-undo-pill">Undo: 1</small>
        </div>
        <div id="p2-score-card" class="player-score">
            <span class="p2-text">Jaune</span>
            <span id="p2-wins" class="score-val">0</span>
            <small id="p2-undo-pill">Undo: 1</small>
        </div>
    </div>

    <div class="status-bar" id="game-status">Tour du Joueur Rouge</div>

    <div class="controls">
        <button id="btn-undo">Annuler</button>
        <button class="btn-primary" id="btn-new-round">Nouvelle Manche</button>
        <button id="btn-reset">Reset Match</button>
        <div class="toggle-container">
            <input type="checkbox" id="twist-mode"> <label for="twist-mode">Twist</label>
        </div>
        <div class="toggle-container">
            <input type="checkbox" id="sound-toggle" checked> <label for="sound-toggle">Sons</label>
        </div>
    </div>

    <div class="board-container">
        <div class="board-inner-bg"></div>
        
        <div id="discs-container"></div>
        
        <svg id="board-svg" viewBox="0 0 500 430" preserveAspectRatio="xMidYMid meet">
            <defs>
                <mask id="grid-mask">
                    <rect width="500" height="430" fill="white" />
                    <g id="mask-holes"></g>
                </mask>
            </defs>
            <rect width="500" height="430" fill="#1e3799" mask="url(#grid-mask)" />
            <rect width="500" height="430" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="10" />
        </svg>

        <svg id="win-layer-svg" viewBox="0 0 500 430" preserveAspectRatio="xMidYMid meet">
            <g id="win-highlights-layer"></g>
        </svg>

        <div id="click-grid" class="click-grid"></div>
    </div>

    <div id="modal">
        <div class="modal-content">
            <h2 id="modal-title">Match Terminé !</h2>
            <button class="btn-primary" id="btn-modal-reset">Rejouer</button>
        </div>
    </div>

    <audio id="sfx-drop" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
    <audio id="sfx-win" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
